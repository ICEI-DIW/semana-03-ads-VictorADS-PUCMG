<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    
        <div class="caixaLogin"><!--Caixa de login centralizada-->
            <img src="img/icon/iconedePagina.jpeg" alt="Usuário" class="iconeUsuario"> <!--Icone do login-->
            <h2>LOGIN</h2>
            <form>
                <input type="email" placeholder="Gmail" required> <!--gmail ou usuario, pode ser alterado no fim do projeto para melhor experiencia -->
                <input type="password" placeholder="Senha" required> <!--Senha padrão para login -->
                <button type="submit" class="botaoLogin">Entrar</button> <!--botão de logar-->
            </form>
            <div class="caixaBotaoExtra"> <!--Opçoes de entrada-->
                <button class="botaoExtra">Esqueci a senha</button> <!--botão a esquerda-->
                <button class="botaoExtra">Criar conta</button> <!--botão a direita-->
            </div>
        </div>
    
</body>
</html>
