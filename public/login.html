<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    
        <div class="caixaLogin">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Usuário" class="iconeUsuario">
            <h2>Login</h2>
            <form>
                <input type="email" placeholder="Gmail" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit" class="botaoLogin">Entrar</button>
            </form>
            <div class="caixaBotaoExtra">
                <button class="botaoExtra">Esqueci a senha</button>
                <button class="botaoExtra">Criar conta</button>
            </div>
        </div>
    
</body>
</html>
