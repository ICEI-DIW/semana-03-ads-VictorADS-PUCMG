<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="../img/icon/iconedePagina.jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../styles/login.css">
</head>

<body>
  <!-- Container principal do formulário de login -->
  <div class="caixaLogin">
    <!-- Ícone do usuário -->
    <img src="../img/icon/iconedePagina.jpeg" alt="Ícone do usuário" class="iconeUsuario">
    <!-- Título da página -->
    <h2>LOGIN</h2>

    <!-- Formulário de login -->
    <!-- onsubmit impede o reload e chama fazerLogin -->
    <form onsubmit="fazerLogin(event)">
      <!-- Campo de e-mail -->
      <input type="email" id="email" placeholder="Gmail" required>
      <!-- Campo de senha -->
      <input type="password" id="senha" placeholder="Senha" required>
      <!-- Botão de login, inicialmente desabilitado até o JSON carregar -->
      <button type="submit" class="botaoLogin" id="botaoLogin" disabled>
        Entrar
      </button>
    </form>

    <!-- Botões extras -->
    <div class="caixaBotaoExtra">
      <button class="botaoExtra">Esqueci a senha</button>
      <button class="botaoExtra">Criar conta</button>
    </div>
  </div>

  <script>
    // Array que receberá os usuários do JSON
    let usuarios = [];

    // Carrega o JSON de usuários assim que o script roda
    fetch('../javascript/login.json')
      .then(response => {
        // Se houve erro no fetch, lança exceção
        if (!response.ok) {
          throw new Error('Erro ao carregar dados dos usuários');
        }
        return response.json();
      })
      .then(data => {
        // Salva no array e habilita o botão de login
        usuarios = data;
        console.log('Usuários carregados:', usuarios);
        document.getElementById("botaoLogin").disabled = false;
      })
      .catch(error => {
        // Em caso de falha, mostra alerta
        console.error('Erro ao carregar usuários:', error);
        alert('Não foi possível carregar os dados de login. Tente novamente mais tarde.');
      });

    /**
     * Função chamada ao submeter o formulário de login.
     * @param {Event} event - O evento de submit do formulário
     */
    function fazerLogin(event) {
      // Impede comportamento padrão (recarregar a página)
      event.preventDefault();

      // Lê valores dos campos
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      // Se o array de usuários ainda não foi preenchido, avisa o usuário
      if (usuarios.length === 0) {
        alert('Os dados dos usuários ainda não foram carregados. Aguarde um momento.');
        return;
      }

      // Procura usuário cujo email e senha batem
      const usuario = usuarios.find(u => u.email === email && u.senha === senha);

      if (usuario) {
        // Se encontrado, salva no localStorage e redireciona
        alert(`Bem-vindo, ${usuario.nome}!`);
        localStorage.setItem("usuarioLogado", JSON.stringify(usuario));
        window.location.href = "usuario.html";
      } else {
        // Se não, mostra erro
        alert("Email ou senha incorretos!");
      }
    }
  </script>
</body>

</html>
