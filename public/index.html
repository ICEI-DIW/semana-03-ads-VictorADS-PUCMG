<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/icon/iconedePagina.jpeg" style="border-radius: 50%;">
    <title>Odisseia</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/CardsDeManga.css">
</head>

<body>
    <!-- Cabeçalho principal -->
    <header class="cabecalho">
        <img src="img/icon/iconedePagina.jpeg" alt="Ícone" class="icone">
        ODISSEIA
    </header>
    
    <!-- Barra de navegação -->
    <nav class="painelDeNavegacao">
        <div class="menu">
          <a href="pagina/Mangas.html">MANGÁS</a> |
          <a href="">CONTATO</a> |
          <a href="">DOAÇÕES</a> |
          <a href="index.html">HOME</a> |
          <a href="">DISCORD</a> |
        </div>
      </nav>
    
    <!-- Barra de busca -->
    <nav class="barraDeBusca">
        <div class="containerBusca">
            <input type="text" class="campoBusca" placeholder="Buscar..." />
            <button class="botaoBusca">Buscar</button>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="containerPrincipal">
        <!-- Vídeo em destaque -->
        <div class="secaoGenero">
            <div style="display: flex; justify-content: center; margin: 20px 0;">
                <iframe width="940" height="500" src="https://www.youtube.com/embed/G0aIPjn9DR8?si=5KpCf_42gagFvmjs"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            
            <!-- Seção de mangás em destaque -->
            <h2 class="tituloGenero">Mangás em Destaque</h2>
            <div class="containerCarrossel">
                <button class="botaoRolagem rolarEsquerda" onclick="scrollDestaques('left')">◀</button>
                <div class="carrossel" id="carrossel-destaque"></div>
                <button class="botaoRolagem rolarDireita" onclick="scrollDestaques('right')">▶</button>
            </div>
        </div>
    </main>

    <!-- Botão flutuante -->
    <a href="Login.html" class="botaoFlutuante"></a>

    <!-- Rodapé -->
    <footer class="rodape">
        Victor Hugo (PUC-ADS)
    </footer>

    <script>
        function carregarDestaques() {
            const carrossel = document.getElementById('carrossel-destaque');
            const mangasDestaque = listaDeMangas.filter(manga =>
                manga.destaque && String(manga.destaque).toLowerCase() === "sim"
            );

            if (mangasDestaque.length === 0) {
                carrossel.innerHTML = '<p style="padding: 20px; text-align: center; color: #ff5555;">Nenhum mangá em destaque</p>';
                return;
            }

            carrossel.innerHTML = mangasDestaque.map(manga => `
                <div class="cardManga" onclick="window.location.href='pagina/detalhes.html?id=${manga.id}'">
                    <img src="${manga.imagem}" alt="${manga.titulo}" class="capaManga"
                         onerror="this.src='/public/img/fallback-image.jpg'">
                    <div class="infoManga">
                        <h3 class="tituloManga">${manga.titulo}</h3>
                        <div class="detalhesManga">
                            <span>${manga.lancamento}</span>
                            <span>• ${manga.tema}</span>
                        </div>
                    </div>
                    <div class="infoHoverManga">
                        <p>${manga.descricao || 'Descrição não disponível'}</p>
                    </div>
                </div>
            `).join('');

            // Efeito de glitch nos cards
            const cards = document.querySelectorAll('.cardManga');
            cards.forEach(card => {
                setInterval(() => {
                    card.style.borderColor = `#${Math.floor(Math.random() * 16777215).toString(16)}`;
                }, Math.random() * 2000 + 1000);
            });

            const lastItem = carrossel.lastElementChild;
            if (lastItem) lastItem.style.marginRight = '30px';
        }

        function scrollDestaques(direction) {
            const carrossel = document.getElementById('carrossel-destaque');
            const scrollAmount = 300;

            carrossel.scrollBy({
                left: direction === 'left' ? -scrollAmount : scrollAmount,
                behavior: 'smooth'
            });
        }

        document.addEventListener('DOMContentLoaded', carregarDestaques);
    </script>

    <script src="Javascript/app.js"></script>
</body>

</html>
